# ============================================
# LibrePM Backend Configuration
# ============================================

spring:
  application:
    name: LibrePM

  profiles:
    active: desktop

  datasource:
    url: jdbc:sqlite:${librepm.data.path}/librepm.db?busy_timeout=5000
    driver-class-name: org.sqlite.JDBC

  jpa:
    database-platform: org.hibernate.community.dialect.SQLiteDialect
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          batch_size: 20
        order_inserts: true
        order_updates: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

server:
  port: 0
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info

# ============================================
# LibrePM Custom Properties
# ============================================
librepm:
  mode: desktop

  # Data path is injected via System Property in LibrePMApplication.java
  # librepm.data.path = user.home/.librepm (or similar)
  data:
    path: ${LIBREPM_DATA_PATH:${user.home}/.librepm}

  port:
    config-file: ${librepm.data.path}/config/backend.port
    min: 8000
    max: 9000

  assets:
    storage-path: ${librepm.data.path}/assets
    max-file-size: -1
    # CSV: va bene sia per @Value che per ConfigurationProperties List
    allowed-extensions: "png,jpg,jpeg,webp,gif,pdf,txt,md,json,csv"

  cors:
    # CSV: binder -> List<String>
    allowed-origins: "http://localhost:5173,http://localhost:*,http://127.0.0.1:*,file://*"
    allow-credentials: true
    max-age-seconds: 3600

# OpenAPI / Swagger (PRD-14-FR-005)
springdoc:
  api-docs:
    path: /api/docs/openapi
  swagger-ui:
    path: /api/docs

  # OAuth2 / OIDC (quando lo attiveremo davvero, lo userà Spring Security)
  auth:
    enabled: false
    registration-id: librepm
    post-login-redirect: http://localhost:5173/

# ============================================
# Logging
# ============================================
logging:
  level:
    root: INFO
    com.lorenzodm.librepm: DEBUG
    org.springframework.web: INFO
    org.hibernate.SQL: DEBUG
  pattern:
    console: "%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: ${librepm.data.path}/logs/librepm.log
    max-size: 10MB
    max-history: 7

---
# ============================================
# Profile: Development (standalone)
# ============================================
spring:
  config:
    activate:
      on-profile: dev

server:
  port: 8080

librepm:
  mode: web
  # In dev mode, we might want to override the system property to keep data local to the project
  # data:
  #   path: ./data-dev
  cors:
    allowed-origins: "http://localhost:5173,http://localhost:*,http://127.0.0.1:*,file://*"
    allow-credentials: true
    max-age-seconds: 3600
  auth:
    enabled: false

logging:
  level:
    com.lorenzodm.librepm: TRACE
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE

---
# ============================================
# Profile: Desktop (embedded in Electron)
# ============================================
spring:
  config:
    activate:
      on-profile: desktop

server:
  port: 0

librepm:
  mode: desktop
  cors:
    allowed-origins: "http://localhost:5173,http://localhost:*,http://127.0.0.1:*,file://*"
    allow-credentials: true
    max-age-seconds: 3600
  auth:
    enabled: false

logging:
  level:
    root: WARN
    com.lorenzodm.librepm: INFO

---
# ============================================
# Profile: Production (futuro cloud)
# ============================================
spring:
  config:
    activate:
      on-profile: production

server:
  port: 8080

librepm:
  mode: web
  cors:
    allowed-origins: "https://example.com"
    allow-credentials: true
    max-age-seconds: 3600
  auth:
    enabled: true
    post-login-redirect: https://example.com/

logging:
  level:
    root: WARN
    com.lorenzodm.librepm: INFO

---
# ============================================
# Profile: Cloud (sezione bandi di Angeli del Futuro)
# ============================================
# LibrePM gira come backend pubblico dietro HTTPS, con lo schema su un database
# MySQL condiviso — servizio unico, database separato da quello del gestionale.
# Nessun valore permissivo ha un default: CloudSecurityConfig rifiuta di
# avviarsi senza issuer o con origini aperte. Su un URL pubblico un default
# comodo non è un inconveniente, è una fuga di dati.
#
#   SPRING_DATASOURCE_URL       jdbc:mysql://<host>:<porta>/librepm?sslMode=REQUIRED
#   SPRING_DATASOURCE_USERNAME
#   SPRING_DATASOURCE_PASSWORD  da Secret Manager, mai nel repository
#   CLERK_ISSUER_URI            stessa istanza Clerk del gestionale
#   CORS_ALLOWED_ORIGINS        origine esatta della SPA, senza wildcard
#   PORT                        iniettata da Cloud Run
spring:
  config:
    activate:
      on-profile: cloud

  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      # Il piano Aiven Free ha un tetto basso di connessioni e lo condividiamo
      # col gestionale: tenere il pool corto è una precauzione, non un dettaglio.
      maximum-pool-size: ${DB_POOL_MAX:5}
      minimum-idle: ${DB_POOL_MIN:1}

  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    # Lo schema è di proprietà di Flyway. Hibernate non lo modifica.
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        boot:
          allow_jdbc_metadata_access: true

  flyway:
    enabled: true
    # Set di migrazioni separato: quelle in db/migration sono scritte per SQLite
    # e su MySQL non si applicano.
    locations: classpath:db/migration_mysql
    baseline-on-migrate: true

server:
  port: ${PORT:8080}
  address: 0.0.0.0
  shutdown: graceful
  # Dietro il proxy TLS di Cloud Run: rispetta X-Forwarded-* per costruire URL
  # e redirect corretti.
  forward-headers-strategy: framework

management:
  health:
    diskspace:
      enabled: false

librepm:
  mode: web
  # Su Cloud Run il filesystem è effimero e la home può non essere scrivibile.
  data:
    path: ${LIBREPM_DATA_PATH:/tmp/librepm}
  cors:
    # Origine esatta della SPA. Nessun default: con la lista vuota o con "*"
    # l'applicazione non parte.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}
    # Identità via Bearer token: nessun cookie da inviare cross-site.
    allow-credentials: false
    max-age-seconds: 3600
  auth:
    # Non configurabile da variabile d'ambiente di proposito: sul web l'unica
    # modalità ammessa è quella autenticata. Un LIBREPM_AUTH_ENABLED=false
    # aprirebbe tutte le API.
    enabled: true
  clerk:
    # Stessa istanza Clerk del gestionale: un solo account per le due sezioni.
    issuer-uri: ${CLERK_ISSUER_URI:}
    audience: ${CLERK_AUDIENCE:}

logging:
  level:
    root: INFO
    com.lorenzodm.librepm: INFO
  # Su Cloud Run i log vanno su stdout, non su file: la cartella logs
  # sparirebbe a ogni riavvio dell'istanza.
  file:
    name: ""
