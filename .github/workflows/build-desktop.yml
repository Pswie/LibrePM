name: Build Desktop

on:
  push:
    branches: [ "master" ]
    tags: [ "*RELEASE" ]
  pull_request:
    branches: [ "master" ]
  workflow_dispatch:

jobs:
  build-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew --no-daemon clean build

      - name: Upload Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-backend-test-reports
          path: build/reports/tests/test/

      - name: Prepare Backend Artifact
        run: |
          mkdir -p ci-artifacts/backend
          JAR_PATH="$(find build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*-plain.jar' -printf '%T@ %p\n' | sort -nr | head -n 1 | cut -d' ' -f2-)"
          test -n "$JAR_PATH"
          cp "$JAR_PATH" ci-artifacts/backend/backend.jar

      - name: Upload Backend Artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-jar
          path: ci-artifacts/backend/backend.jar

  build-desktop:
    needs: build-backend
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: linux
            artifact_name: desktop-app-linux-x64
          - os: windows-latest
            target: win
            artifact_name: desktop-app-windows-x64
          - os: macos-latest
            target: mac
            artifact_name: desktop-app-macos-native
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Download Backend Artifact
        uses: actions/download-artifact@v4
        with:
          name: backend-jar
          path: build/libs

      - name: Install Dependencies
        working-directory: ./desktop
        shell: bash
        run: npm ci

      - name: Build & Package Electron App
        working-directory: ./desktop
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npm run prepare:desktop && npx electron-builder --${{ matrix.target }} --publish never

      - name: Upload Desktop Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            desktop/dist-electron/*.AppImage
            desktop/dist-electron/*.deb
            desktop/dist-electron/*.snap
            desktop/dist-electron/*.exe
            desktop/dist-electron/*.zip
            desktop/dist-electron/*.dmg

  # Crea archivio sorgenti scaricabile come artifact
  source-archive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create Source Archive
        run: |
          VERSION="${GITHUB_REF_NAME}"
          git archive --format=zip --prefix="LibrePM-${VERSION}/" HEAD -o "LibrePM-${VERSION}-source.zip"
          git archive --format=tar.gz --prefix="LibrePM-${VERSION}/" HEAD -o "LibrePM-${VERSION}-source.tar.gz"

      - name: Upload Source Archives
        uses: actions/upload-artifact@v4
        with:
          name: source-code
          path: |
            LibrePM-*-source.zip
            LibrePM-*-source.tar.gz

  # Crea una GitHub Release quando si pusha un tag *RELEASE
  release:
    if: endsWith(github.ref, 'RELEASE')
    needs: [build-desktop, source-archive]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare release files
        run: |
          mkdir -p release-files
          cp artifacts/source-code/* release-files/ || true
          cp artifacts/desktop-app-linux-x64/* release-files/ || true
          cp artifacts/desktop-app-windows-x64/* release-files/ || true
          cp artifacts/desktop-app-macos-native/* release-files/ || true
          cp artifacts/backend-jar/* release-files/ || true
          ls -la release-files/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release-files/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
