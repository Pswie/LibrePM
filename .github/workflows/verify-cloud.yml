name: Verify Cloud

on:
  push:
    branches: ["cloud/adf-bandi"]
  pull_request:
    branches: ["cloud/adf-bandi"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: librepm
          MYSQL_ROOT_PASSWORD: librepm-test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -plibrepm-test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=15
    env:
      # Database effimero della CI: nessun accesso al database in esercizio.
      MYSQL_TEST_URL: jdbc:mysql://127.0.0.1:3306/librepm?useSSL=false&allowPublicKeyRetrieval=true
      MYSQL_TEST_USER: root
      MYSQL_TEST_PASSWORD: librepm-test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
      - run: chmod +x gradlew
      - name: Test API, security and MySQL migrations; build backend
        run: ./gradlew --no-daemon test bootJar
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cloud-backend-test-reports
          path: |
            build/reports/tests/test/
            build/test-results/test/*.xml

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run lint
      - name: Test authenticated downloads and project exports
        run: node --test scripts/api-regressions.test.mjs
      - name: Test grant forms and project switching in Chrome
        run: npm run test:grants
      - name: Build desktop renderer
        run: npm run build
      - name: Build web renderer
        env:
          # Valori pubblici fittizi: la CI non pubblica e non contatta Clerk.
          VITE_API_BASE_URL: https://api.example.org/api
          VITE_CLERK_PUBLISHABLE_KEY: pk_test_ZXhhbXBsZS5jbGVyay5hY2NvdW50cy5kZXYk
          VITE_CLERK_PRIMARY_URL: https://example.org
        run: npm run build:web
