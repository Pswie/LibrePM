plugins {
	id 'java'
	id 'org.springframework.boot' version '3.4.0'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.lorenzodm'
version = '0.1.1'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

// Genera META-INF/build-info.properties
springBoot {
    buildInfo()
}

repositories {
	mavenCentral()
}

dependencies {
	// Web + REST
	implementation 'org.springframework.boot:spring-boot-starter-web'

	// Validation (jakarta.validation)
	implementation 'org.springframework.boot:spring-boot-starter-validation'

	// JPA/Hibernate
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.hibernate.orm:hibernate-community-dialects'

	// SQLite JDBC driver
	runtimeOnly 'org.xerial:sqlite-jdbc:3.46.1.3'

	// MySQL JDBC driver — serve solo al profilo `cloud`, dove lo schema vive
	// sul database condiviso con il gestionale.
	runtimeOnly 'com.mysql:mysql-connector-j'

	// Flyway
	implementation 'org.flywaydb:flyway-core'
	// Flyway 10+ tiene i dialetti fuori dal core: senza questo modulo le
	// migrazioni MySQL non partono.
	runtimeOnly 'org.flywaydb:flyway-mysql'

	// Logging
	implementation 'org.springframework.boot:spring-boot-starter-logging'

	// Actuator (health/info)
	implementation 'org.springframework.boot:spring-boot-starter-actuator'

	// Security + OAuth2 client
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-oauth2-client'
	// Resource server: nel profilo `cloud` l'identità arriva come JWT Clerk,
	// verificato via JWKS. Nessuna sessione, nessuna credenziale locale.
	implementation 'org.springframework.boot:spring-boot-starter-oauth2-resource-server'

	// Config metadata (optional ma utile)
	annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'

	// PDF report generation (PRD-14-FR-004)
	implementation 'com.openhtmltopdf:openhtmltopdf-pdfbox:1.0.10'

	// OpenAPI / Swagger documentation (PRD-14-FR-005)
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.3.0'

	// Test
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.springframework.security:spring-security-test'
	testImplementation 'org.testcontainers:junit-jupiter'
	testImplementation 'org.testcontainers:mysql'
	testRuntimeOnly 'com.h2database:h2'
}

tasks.named('test') {
	useJUnitPlatform()

	// In esercizio la imposta LibrePMApplication.main(), che nei test non viene
	// eseguito. Serve come system property e non come property Spring:
	// logging.file.name la risolve prima che esista l'Environment del test, e
	// senza si ottiene "Circular placeholder reference".
	def testDataDir = layout.buildDirectory.dir('test-data').get().asFile
	systemProperty 'librepm.data.path', testDataDir.absolutePath

	doFirst {
		delete testDataDir
	}

	// Nessun DOCKER_HOST forzato: Testcontainers 1.20 legge da sé i Docker
	// context, e su Docker Desktop per Windows quello attivo è "desktop-linux"
	// con il pipe dockerDesktopLinuxEngine. Imporre il pipe classico
	// docker_engine, che su queste installazioni non esiste, fa saltare i test
	// di integrazione invece di eseguirli — e li fa saltare in silenzio.
	// Per puntare a un MySQL esterno si usa MYSQL_TEST_URL, non DOCKER_HOST.
}
